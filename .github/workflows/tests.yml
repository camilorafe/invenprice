# Herramienta de DESARROLLO (CI). No es una dependencia del sistema en producción:
# el negocio usa InvenPrice sin internet; este workflow solo corre los tests al subir cambios.
name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      # el dataset debe regenerarse idéntico desde el generador (evita ediciones a mano incoherentes)
      - run: python scripts/generar_dataset.py && git diff --exit-code -- data/pricing_reasoning_dataset.jsonl
        shell: bash
